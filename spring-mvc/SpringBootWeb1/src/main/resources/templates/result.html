<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Addition Result</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#11998e,#38ef7d);
}

.container{
    width:450px;
    background:white;
    padding:35px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

h1{
    color:#2c3e50;
    margin-bottom:25px;
}

.alien{
    font-size:30px;
    font-weight:bold;
    color:#e91e63;
    margin:25px 0;
}

a{
    display:inline-block;
    margin-top:20px;
    padding:12px 25px;
    background:#3498db;
    color:white;
    text-decoration:none;
    border-radius:8px;
    transition:0.3s;
}

a:hover{
    background:#2c80b4;
}
</style>

</head>
<body>

<div class="container">

    <h1>🎉 Welcome </h1>

    <div class="alien">
        <p th:text="${alien}"> ${alien} </p>
    </div>

    <a href="/">➕ fill Again</a>

</div>

</body>
</html>
