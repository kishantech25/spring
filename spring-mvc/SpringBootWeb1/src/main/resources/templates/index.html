<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Student Registration</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#4facfe,#00f2fe);
}

.container{
    width:420px;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 8px 20px rgba(0,0,0,0.3);
}

h2{
    text-align:center;
    color:#333;
    margin-bottom:25px;
}

.form-group{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
    color:#555;
}

input{
    width:100%;
    padding:12px;
    border:2px solid #4facfe;
    border-radius:8px;
    font-size:16px;
}

input:focus{
    outline:none;
    border-color:#007bff;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#007bff;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#0056b3;
}
</style>

</head>
<body>

<div class="container">

    <h2>Student Registration</h2>

    <form action="add" method="post">

        <div class="form-group">
            <label>Alien ID</label>
            <input type="number" name="aid" placeholder="Enter Alien ID" required>
        </div>

        <div class="form-group">
            <label>Student Name</label>
            <input type="text" name="aname" placeholder="Enter Alien Name" required>
        </div>

        <button type="submit">Save</button>

    </form>

</div>

</body>
</html>
