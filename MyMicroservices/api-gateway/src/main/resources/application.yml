server:
  port: 8765

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:

        - id: quiz-service
          uri: lb://QUIZ-SERVICE
          predicates:
            - Path=/quiz/**

        - id: question-service
          uri: lb://QUESTION-SERVICE
          predicates:
            - Path=/question/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

    register-with-eureka: true
    fetch-registry: true